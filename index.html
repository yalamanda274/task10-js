<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, rgb(242, 154, 3), white, rgba(31, 238, 12, 0.953));
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        gap: 18px;
    }

    body > h1 {
        color: #1e3a5f;
        font-size: 32px;
        margin-bottom: 10px;
        text-align: center;
    }

    label {
        width: 100%;
        max-width: 420px;
        color: #263445;
        font-weight: bold;
        margin-bottom: -12px;
    }

    input {
        width: 100%;
        max-width: 420px;
        padding: 12px 14px;
        border: 1px solid #b8c7dc;
        border-radius: 8px;
        background-color: #fff;
        font-size: 16px;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 6px rgba(37, 99, 235, 0.3);
    }

    button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background-color: #2563eb;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #1d4ed8;
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    button:active {
        transform: scale(0.97);
    }

    #output {
        width: 100%;
        max-width: 500px;
        min-height: 100px;
        margin-top: 10px;
        padding: 25px;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        overflow-wrap: anywhere;
    }

    #output h1 {
        color: #1e3a5f;
        font-size: 24px;
        margin-bottom: 15px;
    }

    #output h2 {
        color: #475569;
        font-size: 17px;
        margin: 12px 0;
    }

    @media (max-width: 480px) {
        body {
            padding: 25px 15px;
        }

        body > h1 {
            font-size: 26px;
        }

        button {
            width: 100%;
            max-width: 420px;
        }

        #output {
            padding: 18px;
        }
    }
</style>

</head>
<body>
    <h1>Emplloyee Object</h1>
    <label for="">Employee Name </label>
    <input for="" type="text" id="myName" required >

     <label for="">Employee salary </label>
    <input for="" type="text" id="mySal" required >

     <label for="">Employee Job </label>
    <input for="" type="text" id="myJob" required >

    <button onclick="createEmp()" > Create obj </button>

    <button onclick="displayDetails()" > Display details</button>
    <button onclick="deleteDetails()" > delete  details</button>

      <button onclick="updateDetails()">Update Details</button>
    <div id="output" >
        This is div container
        
    </div>


    <script src="object-task-UI.js"></script>


</body>
</html>
